# Render.com free tier (512 MB RAM): GreenMind lite engine (ONNX Runtime, no PyTorch).
# The full PyTorch engine needs ~600 MB and does not fit; see deploy/cloudrun for that version.
services:
  - type: web
    name: greenmind-ai
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements-lite.txt && mkdir -p data runs/health
    startCommand: gunicorn -w 1 --threads 2 --timeout 120 -b 0.0.0.0:$PORT app.main:app
    healthCheckPath: /diag
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GREENMIND_ENGINE
        value: onnx
      - key: ORT_THREADS
        value: "1"
      - key: DATABASE_URL
        value: sqlite:///data/greenmind.db
      - key: FLASK_DEBUG
        value: "0"
      - key: HEALTH_INPUT_SIZE
        value: "224"
      - key: SECRET_KEY
        generateValue: true
      - key: PLANT_ID_API_KEY
        sync: false
      - key: PLANTNET_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
